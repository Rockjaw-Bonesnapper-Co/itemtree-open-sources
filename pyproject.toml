[project]
name = "itemtree-open-sources"
version = "0.1.0"
description = "Corresponding Source for the GPL-3.0 file OpenSources.lua of the ItemTree World of Warcraft addon: its compiler, its sandboxed composer and the pinned upstream commit."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "GPL-3.0-only"
license-files = ["LICENSE", "third_party/**/*"]
authors = [{ name = "Rockjaw Bonesnapper Co" }]
dependencies = [
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["itemtree_open_sources"]
